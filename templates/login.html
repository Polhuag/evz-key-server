{% extends "base.html" %}
{% block title %}Đăng nhập · {{ app }}{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">EV</div>
      <div>
        <div class="auth-name">{{ app }}</div>
        <div class="auth-sub">Bảng điều khiển</div>
      </div>
    </div>

    {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}

    <form method="post" action="/admin/login" autocomplete="on">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}" required autofocus autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn primary" type="submit" style="width:100%;height:36px">Đăng nhập</button>
    </form>

    <div class="auth-foot">Phiên đăng nhập hết hạn sau 12 giờ</div>
  </div>
</div>
<style>
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:22px}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.auth-name{font-size:14px;font-weight:600}
.auth-sub{font-size:12px;color:var(--muted2)}
.auth-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted2);text-align:center}
</style>
{% endblock %}
