{% extends "base.html" %}
{% block title %}Đăng nhập · {{ app }}{% endblock %}
{% block body %}
<div class="auth">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark">EV</div>
      <div>
        <div class="auth-name">{{ app }}</div>
        <div class="auth-sub">Bảng điều khiển quản trị</div>
      </div>
    </div>

    {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}

    <form method="post" action="/admin/login" autocomplete="on">
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}" required autofocus autocomplete="username" placeholder="Nhập tên đăng nhập">
      </div>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu">
      </div>
      <button class="btn primary block" type="submit" style="height:44px">Đăng nhập</button>
    </form>

    <div class="auth-foot">Phiên đăng nhập tự động hết hạn sau 12 giờ</div>
  </div>
</div>
{% endblock %}
