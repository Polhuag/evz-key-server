<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app }}{% endblock %}</title>
<style>
:root{
  --bg:#070a12; --bg2:#0b1020; --card:rgba(20,26,45,.72); --line:rgba(120,140,255,.14);
  --txt:#e8ecff; --mut:#8b95b8; --acc:#7c5cff; --acc2:#22d3ee; --ok:#34d399; --bad:#fb7185; --warn:#fbbf24;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:radial-gradient(1100px 600px at 12% -10%,#1b1450 0%,transparent 60%),
             radial-gradient(900px 500px at 100% 0%,#06303a 0%,transparent 55%),
             linear-gradient(160deg,#070a12,#0a0f1e 60%,#070a12);
  color:var(--txt); min-height:100vh; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
.wrap{display:flex;min-height:100vh}
.side{
  width:236px;flex:0 0 236px;padding:22px 16px;border-right:1px solid var(--line);
  background:linear-gradient(180deg,rgba(12,16,32,.92),rgba(8,11,22,.72));
  backdrop-filter:blur(14px);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:8px;
}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 20px}
.logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 38px;
  background:conic-gradient(from 210deg,#7c5cff,#22d3ee,#7c5cff);
  box-shadow:0 0 22px rgba(124,92,255,.55);display:grid;place-items:center;font-weight:800;color:#0a0f1e;font-size:15px;
}
.brand b{display:block;font-size:14px;letter-spacing:.4px}
.brand span{font-size:10.5px;color:var(--mut);letter-spacing:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;color:var(--mut);
  font-size:13.5px;font-weight:600;transition:.18s;border:1px solid transparent;
}
.nav a:hover{background:rgba(124,92,255,.10);color:var(--txt)}
.nav a.on{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(34,211,238,.08));color:#fff;border-color:rgba(124,92,255,.30)}
.nav a i{width:18px;text-align:center;font-style:normal;font-size:14px;opacity:.9}
.side .foot{margin-top:auto;font-size:11px;color:#5d6684;padding:12px 8px;line-height:1.6}
.main{flex:1;min-width:0;padding:26px 30px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}
.top h1{font-size:21px;margin:0;font-weight:750;letter-spacing:.2px}
.top p{margin:5px 0 0;color:var(--mut);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:700;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:820px){.side{display:none}.main{padding:18px}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;
  backdrop-filter:blur(12px);box-shadow:0 18px 40px -28px rgba(0,0,0,.9);
}
.stat{position:relative;overflow:hidden}
.stat .k{font-size:11px;letter-spacing:1.4px;color:var(--mut);font-weight:700;text-transform:uppercase}
.stat .v{font-size:29px;font-weight:800;margin-top:9px;letter-spacing:-.5px}
.stat .s{font-size:11.5px;color:var(--mut);margin-top:4px}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,rgba(124,92,255,.30),transparent 70%)}
.stat.cyan::after{background:radial-gradient(circle,rgba(34,211,238,.28),transparent 70%)}
.stat.green::after{background:radial-gradient(circle,rgba(52,211,153,.26),transparent 70%)}
.stat.red::after{background:radial-gradient(circle,rgba(251,113,133,.24),transparent 70%)}
h2.sec{font-size:14px;margin:0 0 12px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h2.sec:before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--acc),var(--acc2))}
table{width:100%;border-collapse:collapse;font-size:12.8px}
th{text-align:left;color:var(--mut);font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;padding:10px 12px;
   border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid rgba(120,140,255,.07);vertical-align:middle}
tr:hover td{background:rgba(124,92,255,.045)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.4px}
.badge{display:inline-block;padding:3.5px 9px;border-radius:999px;font-size:10.5px;font-weight:750;letter-spacing:.4px}
.b-ok{background:rgba(52,211,153,.13);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
.b-bad{background:rgba(251,113,133,.13);color:#fda4af;border:1px solid rgba(251,113,133,.3)}
.b-warn{background:rgba(251,191,36,.13);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
.b-mut{background:rgba(255,255,255,.05);color:var(--mut);border:1px solid var(--line)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--txt);font-size:12.5px;font-weight:700;cursor:pointer;transition:.18s;font-family:inherit;
}
.btn:hover{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.4)}
.btn.primary{background:linear-gradient(135deg,#7c5cff,#5b8cff);border-color:transparent;box-shadow:0 10px 24px -12px rgba(124,92,255,.9)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:rgba(251,113,133,.10);border-color:rgba(251,113,133,.3);color:#fda4af}
.btn.danger:hover{background:rgba(251,113,133,.2)}
.btn.sm{padding:6px 11px;font-size:11.5px;border-radius:9px}
input,textarea,select{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line);background:rgba(6,9,18,.65);
  color:var(--txt);font-size:13px;font-family:inherit;outline:none;transition:.18s;
}
input:focus,textarea:focus,select:focus{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 3px rgba(124,92,255,.13)}
label{display:block;font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.6px;margin:0 0 6px;text-transform:uppercase}
.field{margin-bottom:13px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row .field{flex:1;min-width:120px;margin-bottom:0}
.note{font-size:11.5px;color:var(--mut);line-height:1.7}
.alert{padding:12px 14px;border-radius:11px;font-size:12.5px;margin-bottom:14px;border:1px solid}
.alert.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3);color:#a7f3d0}
.alert.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3);color:#fecdd3}
.alert.warn{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.28);color:#fde68a}
.copy{cursor:pointer;border-bottom:1px dashed rgba(124,92,255,.5)}
.copy:hover{color:#c4b5fd}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:12.5px}
.pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:700;color:var(--mut)}
.pill.on{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.45);color:#ddd6fe}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7c5cff,#22d3ee)}
.toast{position:fixed;right:22px;bottom:22px;padding:13px 18px;border-radius:12px;background:rgba(20,26,45,.96);
  border:1px solid var(--line);font-size:12.5px;box-shadow:0 20px 50px -20px #000;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.hero{min-height:100vh;display:grid;place-items:center;padding:26px}
.hero .card{max-width:640px;width:100%;padding:38px 34px;text-align:center}
.hero .logo{width:64px;height:64px;border-radius:20px;font-size:24px;margin:0 auto 20px}
.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:-.4px}
.hero p{color:var(--mut);font-size:13.5px;line-height:1.8;margin:0 0 22px}
.hero .meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
</style>
</head>
<body>
{% block body %}{% endblock %}
<script>
function toast(msg){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show')},1600);}
document.addEventListener('click',function(e){
  var el=e.target.closest('.copy');
  if(!el)return;
  var v=el.getAttribute('data-copy')||el.textContent.trim();
  if(navigator.clipboard){navigator.clipboard.writeText(v).then(function(){toast('Đã copy: '+v)})}
  else{var ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Đã copy: '+v)}
});
</script>
</body>
</html>
