<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{% block title %}{{ app }}{% endblock %}</title>
<style>
:root{
  --bg:#0f1115; --panel:#15181e; --panel2:#1a1e25; --border:#242832; --border2:#2f3440;
  --text:#e6e8ec; --muted:#9aa1ad; --muted2:#6f7785;
  --accent:#4f7cff; --accent-soft:rgba(79,124,255,.12); --accent-text:#8fb0ff;
  --ok:#22c55e; --ok-soft:rgba(34,197,94,.12);
  --warn:#d99a1a; --warn-soft:rgba(217,154,26,.12);
  --bad:#ef4444; --bad-soft:rgba(239,68,68,.12);
  --radius:7px; --radius-sm:5px;
  --sidebar:240px; --topbar:56px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fafafa; --panel:#ffffff; --panel2:#f4f5f7; --border:#e4e6eb; --border2:#d5d8de;
    --text:#14171c; --muted:#666e7a; --muted2:#8b929d;
    --accent:#2563eb; --accent-soft:rgba(37,99,235,.08); --accent-text:#1d4ed8;
    --ok:#15803d; --ok-soft:rgba(21,128,61,.09);
    --warn:#a16207; --warn-soft:rgba(161,98,7,.10);
    --bad:#b91c1c; --bad-soft:rgba(185,28,28,.08);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12px}
.hidden{display:none!important}

/* ---------- shell ---------- */
.app{min-height:100vh}
.sidebar{
  position:fixed;z-index:40;inset:0 auto 0 0;width:var(--sidebar);
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.brand{display:flex;align-items:center;gap:10px;height:var(--topbar);padding:0 16px;border-bottom:1px solid var(--border)}
.brand-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 26px}
.brand-name{font-size:13px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11px;color:var(--muted2)}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-label{font-size:11px;color:var(--muted2);padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);
  color:var(--muted);font-size:13.5px;font-weight:500;box-shadow:inset 0 0 0 0 var(--accent);transition:background .12s,color .12s}
.nav-item:hover{background:var(--panel2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;border-top:1px solid var(--border);padding:10px}
.user{display:flex;align-items:center;gap:9px;padding:6px;border-radius:var(--radius-sm)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--panel2);border:1px solid var(--border2);
  display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted)}
.user-name{font-size:13px;font-weight:600;line-height:1.2}
.user-role{font-size:11px;color:var(--muted2)}
.side-foot form{margin-top:4px}
.logout{width:100%;display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:7px 10px;color:var(--muted);font-size:12.5px;cursor:pointer}
.logout:hover{background:var(--panel2);color:var(--text)}

.main{margin-left:var(--sidebar);min-height:100vh;display:flex;flex-direction:column}
.topbar{height:var(--topbar);position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.crumbs b{color:var(--text);font-weight:600}
.crumbs .sep{color:var(--muted2)}
.top-search{margin-left:auto;position:relative;width:260px;max-width:34vw}
.top-search input{width:100%;height:32px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:0 30px 0 10px;font-size:13px;outline:none}
.top-search input:focus{border-color:var(--accent)}
.top-search .kbd{position:absolute;right:7px;top:7px;font-size:11px;color:var(--muted2);
  border:1px solid var(--border);border-radius:4px;padding:0 5px;line-height:16px;background:var(--panel2)}
.server{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.hamburger{display:none;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);
  width:32px;height:32px;place-items:center;cursor:pointer}

.content{width:100%;max-width:1200px;padding:20px;flex:1}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.page-desc{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.page-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- components ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius)}
.card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600;margin:0}
.card-body{padding:16px}
.card-body.tight{padding:0}

.statrow{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel)}
.stat{flex:1 1 160px;padding:12px 16px;border-right:1px solid var(--border)}
.stat:last-child{border-right:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--muted2);margin-top:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;
  border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--panel);
  font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--border2)}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}
.btn.sm{height:26px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:4px;
  font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.badge.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-soft)}
.badge.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-soft)}
.badge.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad-soft)}
.badge.mut{color:var(--muted);background:var(--panel2);border-color:var(--border)}

.table-wrap{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;z-index:1;background:var(--panel);text-align:left;font-size:12px;font-weight:500;
  color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th a{display:inline-flex;align-items:center;gap:4px}
th a:hover{color:var(--text)}
th .arrow{font-size:9px;color:var(--muted2)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
tbody tr:last-child td{border-bottom:0}
td.actions{text-align:right;white-space:nowrap}
.check{width:14px;height:14px;accent-color:var(--accent);cursor:pointer}

.copy{cursor:pointer;border-radius:3px}
.copy:hover{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}

.menu{position:relative;display:inline-block}
.menu-pop{position:absolute;right:0;top:calc(100% + 4px);min-width:160px;background:var(--panel);
  border:1px solid var(--border2);border-radius:var(--radius);padding:4px;z-index:60;display:none}
.menu-pop.floating{position:fixed;top:0;left:0;right:auto}
.menu.open .menu-pop{display:block}
.menu-pop button,.menu-pop a{display:flex;width:100%;align-items:center;gap:8px;padding:7px 9px;background:none;
  border:0;border-radius:var(--radius-sm);font-size:12.5px;text-align:left;cursor:pointer;color:var(--text)}
.menu-pop button:hover,.menu-pop a:hover{background:var(--panel2)}
.menu-pop .sep{height:1px;background:var(--border);margin:4px 0}
.menu-pop .danger{color:var(--bad)}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--border)}
.toolbar .spacer{margin-left:auto}
.tabs{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden}
.tabs a{padding:5px 10px;font-size:12.5px;color:var(--muted);border-right:1px solid var(--border)}
.tabs a:last-child{border-right:0}
.tabs a:hover{background:var(--panel2);color:var(--text)}
.tabs a.on{background:var(--accent-soft);color:var(--accent-text)}
.search-inline{position:relative}
.search-inline input{height:30px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:0 10px;font-size:12.5px;min-width:200px;outline:none}
.search-inline input:focus{border-color:var(--accent)}

.pagination{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--border);flex-wrap:wrap}
.pagination .info{font-size:12px;color:var(--muted);margin-right:auto}
.pagination a,.pagination span.pg{min-width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12.5px;padding:0 6px;color:var(--muted)}
.pagination a:hover{background:var(--panel2);color:var(--text)}
.pagination .on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.pagination .disabled{opacity:.45;pointer-events:none}

.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--text);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted2);margin-top:4px}
.field .err{font-size:11.5px;color:var(--bad);margin-top:4px}
input[type=text],input[type=number],input[type=password],input[type=file],select,textarea{
  width:100%;height:34px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);
  padding:0 10px;font-size:13px;outline:none}
textarea{height:auto;padding:8px 10px;resize:vertical;min-height:76px;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox],input[type=radio]{width:14px;height:14px;accent-color:var(--accent);vertical-align:-2px}
.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.form-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.check-row{display:flex;align-items:flex-start;gap:8px;padding:9px 0}
.check-row label{font-weight:500;font-size:13px;margin:0}
.check-row .hint{margin-left:22px}

.alert{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:var(--radius-sm);
  font-size:12.5px;border:1px solid;margin-bottom:14px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text)}

.empty{padding:28px 16px;text-align:center}
.empty p{margin:0 0 12px;color:var(--muted);font-size:13px}

.dropzone{border:1px dashed var(--border2);border-radius:var(--radius);padding:22px;text-align:center;cursor:pointer;
  background:var(--bg);transition:border-color .12s,background .12s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .t{font-size:13px;font-weight:500}
.dropzone .s{font-size:12px;color:var(--muted);margin-top:3px}
.fileinfo{display:none;margin-top:10px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;background:var(--panel2)}
.fileinfo.show{display:block}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{word-break:break-all}

.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,8px);z-index:100;background:var(--panel);
  border:1px solid var(--border2);border-radius:var(--radius);padding:8px 14px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.show{opacity:1;transform:translate(-50%,0)}

dialog{border:1px solid var(--border2);border-radius:var(--radius);background:var(--panel);color:var(--text);
  padding:0;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dlg-body{padding:16px}
.dlg-title{font-size:15px;font-weight:600;margin:0 0 6px}
.dlg-text{font-size:13px;color:var(--muted);margin:0}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .form-row{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:768px){
  :root{--topbar:52px}
  .sidebar{transform:translateX(-100%);transition:transform .18s ease;width:264px}
  body.drawer .sidebar{transform:none}
  body.drawer .overlay{display:block}
  .main{margin-left:0}
  .hamburger{display:grid}
  .topbar{padding:0 12px;gap:10px}
  .top-search{display:none}
  .server{display:none}
  .content{padding:12px 12px 84px}
  .page-title{font-size:18px}
  .stat{border-right:0;border-bottom:1px solid var(--border);flex-basis:50%}
  .stat:nth-child(2n){border-right:0}
  .form-row,.form-row.two{grid-template-columns:1fr}
  .toolbar{padding:8px}
  .search-inline input{min-width:0;width:100%}
  .search-inline{flex:1 1 100%}
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{border:1px solid var(--border);border-radius:var(--radius);margin:8px;padding:6px 10px;background:var(--panel)}
  tbody tr:hover{background:var(--panel)}
  td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:10px;font-size:12.5px}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;flex:0 0 auto}
  td.actions{justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border);margin-top:4px}
  td.actions::before{display:none}
  td.cell-check{display:none}
  .fab{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;height:40px;
    background:var(--accent);color:#fff;border:0;border-radius:var(--radius);font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
}
@media (min-width:769px){.fab{display:none}}
</style>
</head>
<body>
{% block body %}{% endblock %}
<div class="overlay" id="overlay"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var body=document.body;
  var ham=document.getElementById('hamburger');
  if(ham) ham.addEventListener('click',function(){body.classList.toggle('drawer')});
  var ov=document.getElementById('overlay');
  if(ov) ov.addEventListener('click',function(){body.classList.remove('drawer')});

  window.toast=function(msg){
    var t=document.getElementById('toast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('show')},1500);
  };
  function copyText(v){
    if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(v)}
    var ta=document.createElement('textarea');ta.value=v;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    ta.remove();return Promise.resolve();
  }
  document.addEventListener('click',function(e){
    var c=e.target.closest('[data-copy]');
    if(c){copyText(c.getAttribute('data-copy')).then(function(){toast('Đã copy')});return}
    var m=e.target.closest('.menu-toggle');
    if(m){var p=m.closest('.menu');var open=p.classList.contains('open');
      document.querySelectorAll('.menu.open').forEach(function(x){x.classList.remove('open')});
      if(!open){
        p.classList.add('open');
        var pop=p.querySelector('.menu-pop');
        if(pop){
          pop.classList.add('floating');
          var r=m.getBoundingClientRect();
          pop.style.left=Math.max(8,Math.min(window.innerWidth-168,r.right-160))+'px';
          pop.style.top='0px';
          var h=pop.offsetHeight, top=r.bottom+4;
          if(top+h>window.innerHeight-8)top=r.top-h-4;
          pop.style.top=Math.max(8,top)+'px';
        }
      }
      e.stopPropagation();return}
    if(!e.target.closest('.menu-pop'))document.querySelectorAll('.menu.open').forEach(function(x){x.classList.remove('open')});
  });
  window.addEventListener('scroll',function(){
    document.querySelectorAll('.menu.open').forEach(function(x){x.classList.remove('open')});
  },{passive:true});
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      var s=document.querySelector('[data-search]');if(s){e.preventDefault();s.focus()}
    }
  });
  document.querySelectorAll('[data-confirm]').forEach(function(f){
    f.addEventListener('submit',function(e){
      var msg=f.getAttribute('data-confirm');
      if(!window.confirm(msg)){e.preventDefault()}
    });
  });
})();
</script>
</body>
</html>
